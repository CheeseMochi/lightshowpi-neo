[pytest]
# Pytest configuration for LightShowPi

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Markers for organizing tests
# gpio/audio/platform tests need real Pi hardware and are skipped unless
# LSP_BENCH=1 (see tests/conftest.py and tests/README.md). Mocked hardware
# tests use unit/integration instead.
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    platform: Tests requiring a Raspberry Pi (Pi 3+); skipped unless LSP_BENCH=1
    gpio: Tests requiring real GPIO hardware wired per tests/bench.yaml; skipped unless LSP_BENCH=1
    audio: Tests requiring real audio hardware (ALSA); skipped unless LSP_BENCH=1
    slow: Tests that take significant time to run

# Minimum Python version
minversion = 3.9

# Path configuration
pythonpath = py

# Ignore paths
norecursedirs =
    .git
    build
    build_dir
    __pycache__
    logs
    music
    *.egg-info

# Filter warnings
filterwarnings =
    # Suppress audioop deprecation warning (will be addressed before Python 3.13)
    ignore:'audioop' is deprecated:DeprecationWarning
