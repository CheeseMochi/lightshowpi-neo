---
# Copy to group_vars/all/secrets.yml (git-ignored), fill in, then encrypt:
#   ansible-vault encrypt group_vars/all/secrets.yml
# and run make with ASK_VAULT=1 (or set ANSIBLE_VAULT_PASSWORD_FILE).

# First admin login for the web UI (must not be "admin123")
vault_lsp_admin_password: "change-me-to-something-long"

# Only needed when (re)registering the bench runner. Get a fresh one (valid ~1h) at
# GitHub repo > Settings > Actions > Runners > New self-hosted runner.
# Usually easier to pass on the command line: make runner HOST=lsp-bench TOKEN=...
# vault_gh_runner_token: ""
