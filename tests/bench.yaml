# LightShowPi Neo GPIO test bench wiring
#
# Used by tests/test_gpio_hardware.py (pytest -m gpio, with LSP_BENCH=1).
# Override the path with LSP_BENCH_CONFIG=/path/to/bench.yaml.
#
# Each pair is [output BCM GPIO, input BCM GPIO]. Wire the output pin straight
# to the input pin with a jumper. A 1k ohm series resistor per jumper is
# recommended: it protects both pins if a misconfigured test ever drives both
# as outputs, and doesn't affect the readings.
#
# Pins avoided on purpose: BCM 2/3 (I2C), 7-11 (SPI), 14/15 (UART),
# 18-21 are left alone where possible because audio HATs use PCM on 18-21.
#
#   Pair   Output BCM (phys)   ->   Input BCM (phys)
#   1      17 (pin 11)         ->   27 (pin 13)
#   2      22 (pin 15)         ->   23 (pin 16)
#   3       5 (pin 29)         ->    6 (pin 31)
#   4      13 (pin 33)         ->   26 (pin 37)
#   5      24 (pin 18)         ->   25 (pin 22)
#   6      12 (pin 32)         ->   16 (pin 36)
#   7       4 (pin 7)          ->   20 (pin 38)
#   8      19 (pin 35)         ->   21 (pin 40)
#
# Pairs 7 and 8 use PCM pins (19, 20, 21); leave them commented out if the
# bench Pi has an audio HAT fitted.
#
# Keep this file to the simple subset below (a "pairs" list of [out, in] and
# flat "key: number" settings) so it parses even without PyYAML.

pairs:
  - [17, 27]
  - [22, 23]
#  - [5, 6]
#  - [13, 26]
#  - [24, 25]
#  - [12, 16]
#  - [4, 20]
#  - [19, 21]

# Seconds to wait after a write before reading the input back
settle_seconds: 0.005

# Soft-PWM duty check: sample the input for this long and compare the fraction
# of HIGH samples with the requested duty cycle. lgpio soft PWM runs at 100 Hz,
# so 0.1 s covers ~10 periods (about +/-5% from window alignment alone).
# Tune these on the bench if the runner is noisy.
pwm_sample_seconds: 0.1
pwm_tolerance: 0.10
pwm_min_samples: 200
