name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      SYNCHRONIZED_LIGHTS_HOME: ${{ github.workspace }}
      GPIOZERO_PIN_FACTORY: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libasound2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (errors only)
        # Legacy code is not flake8-clean yet; fail only on syntax errors and undefined names
        run: flake8 py api tests tools --count --select=E9,F63,F7,F82 --extend-ignore=F824 --show-source --statistics

      - name: Test
        # Hardware tests (gpio/audio/platform) run on the Pi bench, not here
        run: pytest -m "not gpio and not audio and not platform" --cov=py --cov=api --cov-report=term-missing:skip-covered

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14

  worker:
    name: Cloud Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json

      - run: npm ci
      # vitest in workerd (the Workers runtime); needs no web build or Cloudflare account
      - run: npm test
